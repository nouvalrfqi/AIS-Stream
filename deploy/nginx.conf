# Maritime Real-Time Tracking — nginx site (VPS deployment)
# Serves the built React SPA and reverse-proxies /api to the FastAPI service.
# <ROOT> is substituted with the absolute project root by deploy/install-systemd.sh.
# root is NOT quoted: a quoted root + try_files triggers an nginx redirection cycle.
server {
    listen 80;
    server_name _;

    root <ROOT>/frontend/dist;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;

    # API -> FastAPI (uvicorn on loopback, path prefix stripped)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Hashed build assets: immutable long-term cache
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }
}